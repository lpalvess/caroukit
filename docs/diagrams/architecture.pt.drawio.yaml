    label: "Preset de saída\nCLI / dimensões"
  - id: source
    label: "Conteúdo preparado\npelo usuário"
  - id: author
    label: "Você ou agente\nexterno opcional"
  - id: slides
    label: "slides.json\nconteúdo + tema"
  - id: validate
    label: "validate\nestrutura, limites\ne regras técnicas"
  - id: fail
    label: "Entrada inválida:\nreprova, sem PDF"
